:`Vinegar finishing sauce`,items:[`1 cup apple cider vinegar`,`2 tbsp brown sugar`,`1 tbsp hot sauce`,`1 tsp kosher salt, then adjust to taste`,`½ tsp black pepper + a pinch of cayenne`]}],steps:[{title:`Mustard. Rub. Rest.`,cue:`20 min prep · overnight optional`,body:`Trim hard fat to about ¼ inch. Pat the meat dry, coat lightly with yellow mustard, then cover every side with the rub. Refrigerate uncovered overnight if you have time. Otherwise keep refrigerated while you set up the grill; no room-temperature warmup is needed.`},{title:`Build the cool zone`,cue:`Grill ambient: 250–275°F`,body:`Follow your grill’s lighting instructions and preheat with the lid closed. Turn off the burners below the pork and adjust the burner on the opposite side to hold 250–275°F at grate level. Put a drip pan below the meat without blocking burner airflow. Place a smoker box or foil packet on the grill’s approved support above the lit burner, never directly on the burner tube. Use dry wood chips unless your smoker-box instructions specify otherwise.`},{title:`Let the bark happen`,cue:`About 5–8 hr · bark decides`,body:`Place the pork over the unlit burners, fat cap toward the strongest heat. Keep the lid closed. Maintain light smoke for the first 3–4 hours, replenishing chips as needed. After 3 hours, lightly spritz only dry-looking patches, no more than hourly. Expect the temperature to stall around 150–170°F; that is normal.`},{title:`Wrap when it is ready`,cue:`Usually 160–175°F internally`,body:`When the bark is dark and firmly attached, wrap tightly in two layers of heavy foil with ¼ cup apple juice. Unwaxed butcher paper also works, but use little or no liquid. Return to indirect heat at 250–275°F. Once wrapped, a 275°F oven is an equally useful finish and saves propane.`},{title:`Chase tenderness`,cue:`Usually 195–205°F · about 3–8 hr more`,body:`Start testing around 195°F. Probe several thick spots away from the bone; it should feel like softened butter. Keep cooking if there is resistance, even if it reaches 203°F. Allow roughly 10–16 hours total cooking for a 7–9 lb shoulder, with extra buffer. Time and temperature are guides, not a promise.`},{title:`Rest, pull, finish`,cue:`Rest 1–2 hr · hold at 140°F or above`,body:`Open the wrap briefly for about 10 minutes to release steam, then rewrap. Rest 1–2 hours in an insulated cooler or low oven, checking that the meat stays at least 140°F if holding hot. Pull, discard large fat pockets, and mix in defatted cooking juices. Stir the finishing sauce until dissolved; add a few tablespoons at a time to taste. Refrigerate leftovers within 2 hours after hot holding ends.`}]},{id:`pepper-ribeye`,protein:`Beef`,title:`Pepper-crusted ribeye`,headline:[`Hard sear.`,`Soft center.`],description:`A proper pepper crust, garlic butter, and a cooler zone to finish with control.`,time:`15–25 min + rest`,rest:`5–10 minutes`,serves:`2`,method:`Direct, then indirect`,grill:[450,500],internal:[145],finish:`Reach 145°F before removing from heat, then rest at least 3 minutes.`,safety:`Whole beef steaks: 145°F minimum + 3-minute rest. Ground beef: 160°F. Lower steak doneness carries more risk.`,wood:`No smoke needed`,tip:`Thickness matters more than weight. Move the steak to the cool zone once the crust looks right.`,ingredients:[{title:`Steaks & seasoning`,items:[`2 ribeye steaks, 1¼–1½ inches thick`,`2 tsp Dijon mustard, for a thin binder coat`,`1½ tsp kosher salt, or to taste`,`2 tsp coarse black pepper`,`1 tsp garlic powder`]},{title:`Garlic butter`,items:[`2 tbsp softened unsalted butter`,`1 small garlic clove, finely grated`,`1 tsp chopped parsley`,`A squeeze of lemon`]}],steps:[{title:`Season the steaks`,cue:`10 min prep`,body:`Pat the steaks dry. Brush with a very thin layer of Dijon mustard, then season with salt, pepper, and garlic powder. Mix the butter, garlic, parsley, and lemon in a small bowl. Keep meat refrigerated while the grill preheats.`},{title:`Set a hot and cool side`,cue:`Grill ambient: 450–500°F`,body:`Preheat the gas grill with the lid closed. Clean the grates. Leave one burner area unlit for finishing and move the steaks there if you see a flare-up.`},{title:`Build the crust`,cue:`About 3–4 min per side`,body:`Sear over the lit burners until a brown crust forms, turning with tongs. Keep the lid closed between turns. These times are approximate; thickness and the grill’s actual heat matter.`},{title:`Finish with control`,cue:`Internal: 145°F before removal`,body:`Move the steaks over the unlit burner to finish, keeping the grill around 450–500°F. Probe from the side into the center, away from fat and bone. Cook to at least 145°F before removing from the grill.`},{title:`Butter and rest`,cue:`Rest 5–10 min`,body:`Top each steak with garlic butter, loosely tent with foil, and rest 5–10 minutes (at least 3 minutes for safety). Slice against the grain and spoon the board juices over the meat.`}]},{id:`smoky-chicken`,protein:`Poultry`,title:`Smoky mustard chicken thighs`,headline:[`Crisp edges.`,`All the juice.`],description:`Mustard, paprika, and a little brown sugar. Forgiving thighs with a smoky, savory finish.`,time:`35–50 min + rest`,rest:`5 minutes`,serves:`4`,method:`Mostly indirect`,grill:[375,425],internal:[175,185],finish:`Thigh texture target: 175–185°F. Check every piece; poultry must reach at least 165°F.`,safety:`All poultry, including ground chicken and turkey: 165°F minimum. Thighs can go higher for tenderness.`,wood:`Apple, optional`,tip:`Add sweet sauce only in the final few minutes so its sugars do not burn.`,ingredients:[{title:`Chicken & rub`,items:[`8 bone-in, skin-on chicken thighs, about 3 lb`,`2 tbsp yellow or Dijon mustard`,`1½ tsp kosher salt, or to taste`,`2 tsp smoked paprika`,`1 tsp garlic powder`,`1 tsp black pepper`,`2 tsp brown sugar`,`½ tsp cayenne, optional`,`¼ cup barbecue sauce, optional`]}],steps:[{title:`Season under and over`,cue:`15 min prep`,body:`Pat thighs dry and trim dangling skin. Spread a thin coat of mustard over the chicken, then apply the mixed dry seasonings. Keep refrigerated while the grill preheats. Do not rinse raw chicken.`},{title:`Prepare indirect heat`,cue:`Grill ambient: 375–425°F`,body:`Preheat and clean the gas grill. Leave the burners below the chicken off and run the burners beside it. If using apple chips, place them in a smoker box according to your grill’s instructions.`},{title:`Cook skin-side up`,cue:`About 30–40 min`,body:`Arrange thighs skin-side up over the unlit burners and close the lid. Rotate pieces if one side browns faster. Begin checking each piece’s thickest part after 25 minutes, away from bone.`},{title:`Crisp and finish`,cue:`Internal: 175–185°F for thighs`,body:`Briefly move thighs skin-side down over moderate direct heat for 1–3 minutes, watching for flare-ups. Return to indirect heat as needed. Brush on optional sauce near the end. Every piece must reach at least 165°F; thighs are often more tender at 175–185°F.`},{title:`Give it five`,cue:`Rest 5 min`,body:`Move to a clean serving platter and rest for 5 minutes. Serve with slaw, pickles, and anything that catches those juices.`}]},{id:`lemon-salmon`,protein:`Seafood`,title:`Dijon & lemon grilled salmon`,headline:[`Clean heat.`,`Bright finish.`],description:`A light Dijon coat, lemon, and a little dill. An easy weeknight cook with almost no fuss.`,time:`10–15 min`,rest:`3 minutes`,serves:`4`,method:`Direct medium heat`,grill:[400,450],internal:[145],finish:`Measure in the thickest part; reach 145°F before removing from the grill.`,safety:`Fish: 145°F minimum. Use a probe in the thickest part, rather than relying on color alone.`,wood:`None, or mild alder`,tip:`Start skin-side down and leave it there. A fish basket makes delicate fillets easier to lift.`,ingredients:[{title:`Fish & finish`,items:[`4 skin-on salmon fillets, about 6 oz each and 1 inch thick`,`1½ tbsp Dijon mustard`,`¾ tsp kosher salt, or to taste`,`½ tsp black pepper`,`1 tsp garlic powder`,`1 lemon, zest and wedges`,`1 tbsp chopped fresh dill`,`Neutral oil, only for the grates or fish basket`]}],steps:[{title:`Prep the fillets`,cue:`10 min prep`,body:`Pat the salmon dry and check for pin bones. Brush the flesh with a thin layer of Dijon mustard. Sprinkle with salt, pepper, garlic powder, and lemon zest. The mustard is the binder; the oil is only for the cooking surface.`},{title:`Get the grates ready`,cue:`Grill ambient: 400–450°F`,body:`Preheat and clean the gas grill. Lightly oil the grates using tongs and a folded paper towel, or use a lightly oiled fish basket. Leave an unlit zone available if the skin browns too quickly.`},{title:`Skin-side down`,cue:`About 10–15 min`,body:`Place salmon skin-side down over direct medium heat and close the lid. It usually does not need flipping. Start checking at 8 minutes; move to the unlit zone if the bottom is darkening too fast.`},{title:`Probe, then finish`,cue:`Internal: 145°F`,body:`Insert an instant-read probe from the side into the thickest part. Cook to 145°F, then lift with a wide spatula. Rest about 3 minutes and finish with fresh dill and lemon juice.`}]}];function $f(e,t){return e.map(e=>t===`F`?e:Math.round((e-32)*5/9)).join(`–`)+`°`+t}function ep(e,t){return t===`F`?e:e.replace(/(\d+)(?:–(\d+))?°F/g,(e,t,n)=>$f(n?[+t,+n]:[+t],`C`))}var tp=[{id:`pepper-ribeye`,protein:`Beef`,name:`Ribeye steak`,baseId:`pepper-ribeye`,baseLb:2,minLb:.5,maxLb:12,method:`Reverse sear`,grill:[225,250],internal:[145],time:`35–65 min + rest`,rest:`At least 3 minutes`,timing:`For steaks about 1½–2 inches thick. Finish over high direct heat. Thinner steaks cook faster; check early.`,headline:[`Hard sear.`,`Soft center.`],description:`A coarse pepper crust and garlic butter on the richest steak here. Warmed through gently first, then seared hard at the very end.`,family:`steak`},{id:`strip-steak`,protein:`Beef`,name:`New York strip`,midSentenceName:`New York strip`,baseId:`pepper-ribeye`,baseLb:2,minLb:.5,maxLb:12,method:`Reverse sear`,grill:[225,250],internal:[145],time:`35–65 min + rest`,rest:`At least 3 minutes`,timing:`For steaks about 1½–2 inches thick. Total batch weight changes seasoning, not minutes per steak.`,headline:[`Even edge.`,`Clean bite.`],description:`Leaner and firmer than a ribeye, with its fat running along one edge. Same pepper and garlic butter, same slow warm-up before the sear.`,family:`steak`},{id:`sirloin-steak`,protein:`Beef`,name:`Top sirloin steak`,baseId:`pepper-ribeye`,baseLb:2,minLb:.5,maxLb:12,method:`Direct, then indirect`,grill:[400,450],internal:[145],time:`12–25 min + rest`,rest:`5 minutes`,timing:`For steaks about 1 inch thick. Sirloin is lean; probe early and slice against the grain.`,headline:[`Least fat.`,`Least forgiving.`],description:`The leanest of the three steaks, so it goes from right to overdone in about a minute. Probe it earlier than you think you need to.`,family:`steak`},{id:`coffee-ancho-tri-tip`,protein:`Beef`,name:`Tri-tip roast`,baseId:`pepper-ribeye`,baseLb:2.25,minLb:1.5,maxLb:12,method:`Direct, then indirect`,grill:[350,400],internal:[145],time:`35–60 min + rest`,rest:`10–15 minutes`,timing:`For one 2–2½ lb roast: about 20 minutes of prep and 35–60 minutes on the grill, plus a 10–15 minute rest. Seasonings scale with weight, but thickness and the probe decide when it is done.`,headline:[`Dark crust.`,`Bright finish.`],description:`Coffee, ancho and a thin mustard coat, with a cold chipotle-lime sauce alongside. Two grain directions in one roast, so read it before the rub hides them.`,family:`tri-tip`,attribution:{label:`Jamie Purviance’s tri-tip roast, published by Weber`,url:`https://www.weber.com/US/en/recipes/red-meat/tri-tip-roast/weber-2071757.html`,note:`Not affiliated with, endorsed by, or sponsored by Weber-Stephen Products LLC. Adapted rather than reproduced: the rub and sauce proportions are kept, and the method here is rewritten for a gas grill with a mustard binder, an optional dry-brine, and a USDA-guided 145°F finish in place of the original’s lower target. The illustration is AI-generated and is not Weber’s photograph.`}},{id:`holiday-rosemary-juniper-prime-rib`,protein:`Beef`,name:`Bone-in rib roast`,baseId:`pepper-ribeye`,baseLb:4,minLb:3,maxLb:12,method:`Reverse sear, indirect first`,grill:[250,275],internal:[145],time:`2–5 hr + rest`,rest:`20–30 minutes`,timing:`Roughly 40 minutes a pound at this ambient, so a 4 lb roast is about two and a half hours and a 12 lb one is an all-afternoon cook. Shape and thickness move that more than weight does. First check at 60 minutes, then let the probe decide.`,headline:[`Slow first.`,`Sear last.`],description:`A rosemary, juniper and orange crust over a long gentle cook, then a hard sear at the end to rebuild it. Cold horseradish cream alongside, and a rest longer than most people are willing to give it.`,family:`prime-rib`},{id:`steakhouse-beef-bison-burgers`,protein:`Beef`,name:`Burgers, beef or bison`,midSentenceName:`ground beef or bison`,baseId:`pepper-ribeye`,baseLb:1.5,minLb:.5,maxLb:12,method:`Direct sear, two zones`,grill:[450,500],internal:[160],time:`8–14 min + rest`,rest:`3 minutes`,timing:`For patties ¾–1 inch thick, about three to five minutes a side. Thickness decides it, not how many you are cooking — a crowded grate just means working in batches.`,headline:[`Ground meat.`,`Different rules.`],description:`A hard-seared, pepper-forward patty with grated onion worked through it, smoked cheddar and charred onion rounds. Beef or bison, and bison gets oil because it has almost no fat of its own.`,family:`burger`},{id:`seariously-smothered-beef-ribs`,protein:`Beef`,name:`Bone-in beef short ribs`,midSentenceName:`English-cut bone-in beef short ribs`,baseId:`pepper-ribeye`,baseLb:4,minLb:2,maxLb:12,method:`Indirect low heat`,grill:[275,300],internal:[200,205],time:`4–8 hr + rest`,rest:`15–20 minutes`,timing:`Thickness decides this, not batch weight. Ribs carrying 2–3 inches of meat above the bone usually run 4–6 hours; 3–4 inch ribs take 5–8. Reckon on 1½–3 hours building the crust, then 2–4 hours covered, with the first probe 90 minutes after the foil goes on. English-cut only, not flanken or back ribs.`,headline:[`Low and covered.`,`Sauce at the table.`],description:`A peppery mustard-bound rub, a shallow covered braise over the unlit side, then thin coats of brown sugar and Worcestershire brushed on once the meat is already tender. Half the sauce never meets the brush.`,family:`beef-ribs`,attribution:{label:`Weber’s braised and smoked short-rib methods, by Jamie Purviance and the Weber Grill Academy`,url:`https://www.weber.com/US/en/recipes/red-meat/beer-braised-and-mesquite-smoked-short-ribs/weber-7841.html`,note:`Not affiliated with, endorsed by, or sponsored by Weber-Stephen Products LLC. Consulted rather than adapted: those two published methods informed the shape of this one — a long indirect cook, a covered stage, then a glaze at the end — while the rub, the brown sugar and Worcestershire sauce and the shallow gas-grill pan are this project’s own. No beer braise, bourbon glaze or charcoal setup is carried across. The illustration is AI-generated and is not Weber’s photograph.`}},{id:`pork-shoulder`,protein:`Pork`,name:`Bone-in pork shoulder`,baseId:`pork-shoulder`,baseLb:8,minLb:3,maxLb:12,method:`Indirect low heat`,grill:[250,275],internal:[195,205],time:`Allow a full day + rest`,rest:`1–2 hours`,timing:`One shoulder, 3–12 lb. A 7–9 lb shoulder may take 10–16 hours; smaller or larger cuts vary. Weight alone cannot predict the stall.`,headline:[`Low & slow.`,`Big damn flavor.`],description:`Deep bark, a little heat, and fall-apart tender. Your all-day cook, built for a gas grill.`,family:`shoulder`},{id:`pork-chop`,protein:`Pork`,name:`Bone-in pork chops`,baseId:`pork-shoulder`,baseLb:2,minLb:.5,maxLb:12,method:`Direct, then indirect`,grill:[400,450],internal:[145],time:`15–25 min + rest`,rest:`5 minutes`,timing:`For chops about 1–1½ inches thick. Probe beside the bone without touching it.`,headline:[`Bone in.`,`Juice kept.`],description:`A mustard binder and smoked paprika on a thick bone-in chop. Browned over direct heat, then moved off it so the middle can catch up.`,family:`chop`},{id:`pork-tenderloin`,protein:`Pork`,name:`Pork tenderloin`,baseId:`pork-shoulder`,baseLb:2,minLb:.5,maxLb:12,method:`Direct, then indirect`,grill:[400,450],internal:[145],time:`20–35 min + rest`,rest:`5–10 minutes`,timing:`For individual tenderloins around 1–1½ lb. This is tenderloin, not the much thicker pork loin roast.`,headline:[`Quick cook.`,`Easy to miss.`],description:`The leanest thing on the list and the fastest to dry out. Trim the silverskin, tuck the thin tail under, and pull it the moment it hits temperature.`,family:`tenderloin`},{id:`garlic-herb-mayonnaise-pork-chops`,protein:`Pork`,name:`Thick-cut pork chops`,midSentenceName:`pork chops, 1¼–1½ inches thick, bone-in or boneless`,baseId:`pork-shoulder`,baseLb:2.5,minLb:.5,maxLb:12,method:`Direct sear, then indirect`,grill:[450,500],internal:[145],time:`12–26 min + rest`,rest:`3–5 minutes`,timing:`Thickness decides this, not batch weight. Reckon 2–3 minutes a side to sear, then 8–16 minutes over the unlit zone for two chops and 10–20 for four, checking the centre 5–6 minutes after they move across. Boneless chops finish sooner than bone-in.`,headline:[`Mayo goes on.`,`Crust comes off.`],description:`A thin garlic-herb mayonnaise coat that browns into a savoury crust, seared hot and then finished over the unlit side. The mayonnaise is a binder and a browning aid here, not a sauce.`,family:`mayo-chop`},{id:`smoky-chicken`,protein:`Poultry`,name:`Bone-in chicken thighs`,baseId:`smoky-chicken`,baseLb:3,minLb:.5,maxLb:12,method:`Indirect, then crisp`,grill:[375,425],internal:[175,185],time:`35–50 min + rest`,rest:`5 minutes`,timing:`For bone-in, skin-on thighs. Check each piece, especially the largest.`,headline:[`Crisp edges.`,`All the juice.`],description:`Mustard, paprika and a little brown sugar. Thighs forgive a lot, which makes them the easiest bird on the grill.`,family:`thigh`},{id:`chicken-breast`,protein:`Poultry`,name:`Boneless chicken breasts`,baseId:`smoky-chicken`,baseLb:2,minLb:.5,maxLb:12,method:`Direct, then indirect`,grill:[375,425],internal:[165],time:`15–25 min + rest`,rest:`5 minutes`,timing:`For boneless breasts pounded to an even ¾–1 inch. Thick unflattened breasts need longer.`,headline:[`No margin.`,`Pull it early.`],description:`Boneless breast has no fat to hide a mistake in. Pound it to an even thickness, watch the probe, and take it off the moment it reaches 165°F.`,family:`breast`},{id:`chicken-drumsticks`,protein:`Poultry`,name:`Chicken drumsticks`,baseId:`smoky-chicken`,baseLb:3,minLb:.5,maxLb:12,method:`Indirect, then crisp`,grill:[375,425],internal:[175,185],time:`35–50 min + rest`,rest:`5 minutes`,timing:`For standard bone-in drumsticks. Rotate the pieces for even browning and check away from bone.`,headline:[`Dark meat.`,`Hard to ruin.`],description:`Dark meat, plenty of fat, and a bone doing half the work. Drumsticks only improve once they are past the safe minimum.`,family:`drumstick`},{id:`jerk-spiced-grilled-turkey-tenderloin`,protein:`Poultry`,name:`Turkey tenderloin`,baseId:`smoky-chicken`,baseLb:1.25,minLb:.5,maxLb:12,method:`Indirect, then a short sear`,grill:[400,425],internal:[165],time:`24–32 min + rest`,rest:`5 minutes`,timing:`For tenderloins of about 1–1½ lb each, turned once around the 12–15 minute mark. First check at 20 minutes. Once the centre reads 155–160°F it moves over direct heat to brown, and finishes there.`,headline:[`Island heat.`,`Lean meat.`],description:`Allspice, thyme and cinnamon worked into a thin paste on lean turkey, cooked indirect so the spices never scorch, then half a minute a side to brown. Charred pineapple folded through at the end.`,family:`jerk-turkey`},{id:`achiote-lime-grilled-boneless-chicken`,protein:`Poultry`,name:`Achiote-lime boneless thighs`,midSentenceName:`boneless, skinless chicken thighs`,baseId:`smoky-chicken`,baseLb:2,minLb:.5,maxLb:12,method:`Direct heat, turn once`,grill:[425,450],internal:[165],time:`10–16 min + rest`,rest:`5 minutes`,timing:`For boneless, skinless thighs of roughly even thickness. Five to eight minutes on the first side, then turn once and let the probe finish it. The marinade is 20–30 minutes and no longer.`,headline:[`Red paste.`,`Sharp lime.`],description:`Achiote paste, lime and a little honey on boneless thighs over straight direct heat. A short marinade only: leave it in overnight and the lime goes to work on the surface without you.`,family:`achiote`},{id:`sauce-heavy-bbq-boneless-chicken`,protein:`Poultry`,name:`BBQ boneless thighs`,midSentenceName:`boneless, skinless chicken thighs`,baseId:`smoky-chicken`,baseLb:2,minLb:.5,maxLb:12,method:`Direct, then sauced indirect`,grill:[400,425],internal:[165],time:`14–22 min + rest`,rest:`5 minutes`,timing:`Sear three to four minutes a side, move to the unlit zone until the thickest piece is around 150–155°F, then four to six minutes of saucing. The sauce only goes on at the end, because sugar burns.`,headline:[`Thin coats.`,`Real lacquer.`],description:`Boneless thighs grilled clean first, then painted with a sticky sauce in thin coats right at the end. Half the sauce never touches raw chicken and goes on at the table.`,family:`bbq-chicken`},{id:`lemon-salmon`,protein:`Seafood`,name:`Skin-on salmon fillets`,baseId:`lemon-salmon`,baseLb:1.5,minLb:.25,maxLb:8,method:`Direct medium heat`,grill:[400,450],internal:[145],time:`10–15 min`,rest:`About 3 minutes`,timing:`For fillets about 1 inch thick. Cook skin-side down and start checking at 8 minutes.`,headline:[`Skin down.`,`Leave it be.`],description:`A light Dijon coat, lemon and a little dill. Start it skin-side down and resist turning it — that skin is what holds the fillet together.`,family:`fish`},{id:`cod-fillet`,protein:`Seafood`,name:`Cod fillets`,baseId:`lemon-salmon`,baseLb:1.5,minLb:.25,maxLb:8,method:`Basket over medium heat`,grill:[375,425],internal:[145],time:`8–15 min`,rest:`About 3 minutes`,timing:`For fillets about 1 inch thick. A lightly oiled fish basket supports cod’s delicate flakes.`,headline:[`Delicate.`,`Use a basket.`],description:`Cod flakes apart if you look at it wrong. A lightly oiled basket is what gets the fillet from the grate to the plate in one piece.`,family:`fish`},{id:`halibut-fillet`,protein:`Seafood`,name:`Halibut fillets`,baseId:`lemon-salmon`,baseLb:1.5,minLb:.25,maxLb:8,method:`Direct medium heat`,grill:[400,450],internal:[145],time:`10–18 min`,rest:`About 3 minutes`,timing:`For fillets about 1–1½ inches thick. Halibut is lean; check early and lift with a wide spatula.`,headline:[`Meaty fillet.`,`Check it early.`],description:`Firm enough to handle the grates, lean enough to dry out fast. The same Dijon and lemon, lifted off the second it reaches temperature.`,family:`fish`},{id:`lemon-pepper-walleye`,protein:`Seafood`,name:`Walleye fillets`,baseId:`lemon-salmon`,baseLb:1,minLb:.25,maxLb:8,method:`Foil boat over indirect heat`,grill:[375,400],internal:[145],time:`8–25 min`,rest:`None needed · serve hot`,timing:`Thickness decides this one, not weight. About 8–14 minutes for a ¼–½ inch fillet, 12–20 for ½–¾ inch, and 16–25 for ¾–1 inch. Start checking well before the low end.`,headline:[`Foil boat.`,`Nothing to flip.`],description:`Butter and lemon pepper in a shallow open foil boat, sat over an unlit burner with the lid down. The boat holds a delicate fillet together and keeps the butter where it belongs.`,family:`foil-boat`,attribution:{label:`Fishing Addiction Gear’s foil-grilled walleye`,url:`https://fishingaddictiongear.com/blogs/fishin-talk/walleye-recipe-grilled-in-foil`,note:`Not affiliated with, endorsed by, or sponsored by any publisher named here. Written independently rather than adapted: the closest published method seals its foil into a packet and seasons it differently, while this keeps the boat open over an unlit zone and uses lemon pepper. Lake of the Woods’ “Walleye Delight” was the nearest flavour reference. The illustration is AI-generated, and the finish follows USDA guidance rather than the lower figure in the older texture research.`}},{id:`chimichurri-orange-grilled-shrimp`,protein:`Seafood`,name:`Jumbo shrimp`,baseId:`lemon-salmon`,baseLb:1,minLb:.25,maxLb:8,method:`Direct high heat`,grill:[450,475],internal:[145],time:`4–6 min`,rest:`None needed · serve hot`,timing:`About 2 minutes, turn once, then 2–4 minutes more. Jumbo shrimp at this heat go from translucent to rubbery inside a minute, so this is not one to walk away from. Smaller shrimp are faster still.`,headline:[`Four minutes.`,`Do not wander.`],description:`A garlicky herb chimichurri split in two — half to dress the raw shrimp, half held back for the plate — with orange halves charred alongside and squeezed over at the end.`,family:`shrimp`},{id:`champagne-garlic-butter-bath-lobster-tails`,protein:`Seafood`,name:`Lobster tails`,baseId:`lemon-salmon`,baseLb:1,minLb:.25,maxLb:8,method:`Butter bath over an unlit zone`,grill:[325,350],internal:[145],time:`8–22 min + rest`,rest:`1–2 minutes`,timing:`Tail size decides this, not batch weight. Reckon 8–12 minutes for 4–6 oz tails with a first check at 6, 12–16 for 7–9 oz checking at 9, and 16–22 for 10–12 oz checking at 12.`,headline:[`Gentle bath.`,`Pearly meat.`],description:`Split tails nestled shell-down in a shallow pan of butter, sparkling wine, garlic and tarragon, sat over an unlit burner and basted. No flipping, no direct flame, and the basting butter never reaches the table.`,family:`lobster`}],np={Beef:`pepper-ribeye`,Pork:`pork-shoulder`,Poultry:`smoky-chicken`,Seafood:`lemon-salmon`},$=(e,t,n)=>({amount:e,unit:t,name:n}),rp={shoulder:[{title:`Mustard & salt-free rub`,items:[$(3.5,`tbsp`,`yellow mustard, for a thin binder coat`),$(.25,`cup`,`packed brown sugar`),$(3,`tbsp`,`smoked paprika`),$(2,`tbsp`,`coarse black pepper`),$(1,`tbsp`,`garlic powder`),$(1,`tbsp`,`onion powder
