r===`tbsp`&&n>=8&&sp(n/16)&&(n/=16,r=`cup`),cp(n)+` `+r+` `+e.name}var up={Morton:4.8,"Diamond Crystal":2.84};function dp(e){let t=Math.round(e*4);if(t<1)return`a pinch`;if(t<12)return cp(t/4)+` tsp`;let n=t/12;return n<8?cp(Math.round(n*4)/4)+` tbsp`:cp(Math.round(n/16*8)/8)+` cup`}function fp(e){return Object.entries(up).map(([t,n])=>dp(e/n)+` `+t).join(` or `)}function pp(e,t){return Number.isFinite(t)&&t>=e.minLb-1e-6&&t<=e.maxLb+1e-6}function mp(e,t,n=`lb`){let r=tp.find(t=>t.id===e);if(!r)throw Error(`Unknown cut`);if(!pp(r,t))throw Error(`Weight outside supported range`);let i=Qf.find(e=>e.id===r.baseId),a=r.family,o=r.midSentenceName??r.name.toLowerCase(),s=t/r.baseLb,c=op(ip(t,n))+` `+n,l=t*453.59237*.005,u=op(l)+` g kosher salt`,d=a===`shrimp`?`shrimp`:a===`lobster`?`lobster`:r.protein===`Seafood`?`fish`:`meat`,f=a===`burger`?`mixed in at the grill, not ahead — salting ground meat early turns it springy`:a===`beef-ribs`?`use once on the ribs, not again in the rub and not in the sauce`:a===`mayo-chop`?`use once on the chops ahead of time, not again in the binder`:a===`lobster`?`split between the meat and the bath`:a===`foil-boat`?`use once, and only if your lemon pepper is salt-free`:a===`shrimp`?`stirred into the chimichurri, not sprinkled on separately`:a===`prime-rib`?`use once, on the roast the night before, not again in the crust`:a===`jerk-turkey`?`use once, mixed into the paste`:`use once, not again in the rub`,p=u+` (no scale? about `+fp(l)+`) total for the `+d+` — `+f,m=a===`beef-ribs`?`beefRibs`:a===`mayo-chop`?`mayoChop`:a===`burger`?`burger`:a===`lobster`?`lobster`:a===`achiote`?`achiote`:a===`bbq-chicken`?`bbqChicken`:a===`prime-rib`?`primeRib`:a===`jerk-turkey`?`jerkTurkey`:a===`shrimp`?`shrimp`:a===`foil-boat`?`foilBoat`:a===`tri-tip`?`triTip`:a===`shoulder`?`shoulder`:a===`steak`?`steak`:a===`chop`||a===`tenderloin`?`leanPork`:a===`fish`?`fish`:`chicken`,h=[{title:`Your `+d+` & salt`,items:[c+` `+o,p]},...rp[m].map(e=>({title:e.title,items:e.items.map(e=>typeof e==`string`?e:lp(e,s))}))],g=a===`beef-ribs`?`Whole beef cuts reach their safety minimum at 145°F with a 3-minute rest. Short ribs go far past that, and not for safety — the long covered cook is what softens the connective tissue. Reheat leftovers to 165°F.`:a===`burger`?`Ground beef and ground bison: 160°F, measured in the centre of every patty. Grinding spreads surface bacteria right through the meat, which is why this is higher than the 145°F used for whole cuts of beef.`:r.protein===`Poultry`?`Chicken must reach 165°F in every piece. Thighs and drumsticks can go higher for tenderness.`:r.protein===`Seafood`?`Fish and shellfish must reach 145°F in the thickest part before leaving the grill.`:r.protein===`Beef`?`Whole beef cuts — steaks, roasts and chops alike: at least 145°F before removal, followed by a 3-minute rest.`:`Whole pork: at least 145°F before removal, followed by a 3-minute rest.`,_=a===`beef-ribs`?`Probe several meaty spots away from the bone and stop when it glides in with almost no resistance, usually around 200–205°F. That is a tenderness reading rather than the safety number, and a rib that still feels tight is not finished whatever the probe says.`:a===`mayo-chop`?`At least 145°F in the thickest part of every chop, then a 3-minute rest. The binder is fat, so the crust browns early and the colour arrives well before the centre does.`:a===`burger`?`Every patty reaches 160°F in its centre before it leaves the grill, then rests 3 minutes. A safe burger can still be pink; colour is not a doneness test.`:a===`lobster`?`Each tail comes out at 145°F in the thickest meat. Pearly and opaque is the clue, the probe is the decision, and the shell and pan both read hotter than the lobster.`:a===`achiote`?`Every thigh reaches 165°F in its thickest part before it comes off. Colour and clear juices prove nothing, least of all under a red marinade.`:a===`bbq-chicken`?`Every thigh reaches 165°F in its thickest part before it comes off. Probe under the glaze; sauce colour is not a doneness reading.`:a===`prime-rib`?`At least 145°F in the centre before it is carved and served, then rest. Three minutes is the safety minimum; 20–30 is what a roast this size actually wants. The sear does not count toward the endpoint.`:a===`jerk-turkey`?`Every part of the tenderloin reaches 165°F before it comes off. That is the poultry endpoint, not the 145°F used for whole cuts of beef and pork.`:a===`shrimp`?`Take them off at 145°F in the thickest shrimp. Opaque flesh is a clue, not a reading, and no rest is needed.`:a===`foil-boat`?`Every fillet reaches 145°F in its thickest part before it leaves the boat. Flaking is a clue, not a reading, and fish needs no rest at this target.`:a===`tri-tip`?`Reach at least 145°F in the thickest part before it leaves the grill, then rest 10–15 minutes. Three minutes is the safety minimum; the rest of it is for the slicing.`:a===`shoulder`?`Pull-apart target: 195–205°F. Probe several thick spots; finish when it slides in with almost no resistance.`:a===`thigh`||a===`drumstick`?`For tender dark meat, aim for 175–185°F. The poultry safety minimum is 165°F.`:r.protein===`Poultry`?`Reach 165°F in the thickest part of every breast.`:r.protein===`Seafood`?`Reach 145°F at the center of the thickest part.`:`Reach 145°F before removing from heat, then rest at least 3 minutes.`,v=a===`beef-ribs`?`15 min prep · 4–24 hr ahead, optional`:a===`mayo-chop`?`30 min ahead, or overnight`:a===`burger`?`Season at the grill, not ahead`:a===`lobster`?`10 min prep`:a===`achiote`?`20–30 min marinade, no longer`:a===`bbq-chicken`?`15–30 min`:a===`shrimp`?`15 min in the marinade, no longer`:a===`prime-rib`?`12–24 hr ahead`:a===`jerk-turkey`?`Just before cooking`:a===`tri-tip`?`4–24 hr ahead, optional`:a===`shoulder`?`12–24 hr ahead, optional`:r.protein===`Poultry`?`2–12 hr ahead, optional`:a===`fish`||a===`foil-boat`?`Just before cooking`:`2–4 hr ahead, optional`,y=[{"foil-boat":{title:`Read the label, then salt`,cue:v,body:`Thaw the fillets in the refrigerator and follow whatever the packet says — vacuum-packed fish usually wants opening before it thaws. Pat them dry and run a finger over each one for pin bones. Now read your lemon-pepper label, because it decides what happens next: most supermarket blends list salt first, and using one of those on top of the listed ${u} will over-salt a thin fillet badly. Use the full measured salt only if your blend is salt-free. Otherwise cut it right back, or leave it out and let the seasoning do the job. Skin can stay on; it goes down against the foil. Keep everything cold until the grill is ready.`},fish:{title:`Season lightly`,cue:v,body:`Pat the fish dry and remove pin bones. Use the listed ${u} across the batch, then brush the flesh with Dijon and add the pepper, garlic, and zest. Keep it refrigerated until the grill is ready.`},"tri-tip":{title:`Map the grain. Salt once.`,cue:v,body:`Before anything goes on the meat, find where the grain changes direction and note it — the rub will hide it, and you need it again at the end. Trim silverskin and hard fat without cutting away good meat. Spread the listed ${u} over the whole roast and refrigerate it uncovered on a rack for 4–24 hours if you have the time. That is the entire salt allowance for the meat, not an extra brine on top of the rub. Cooking now instead? Apply the same salt just before the mustard. For enhanced, injected, koshered, or already-salted beef, skip this added salt.`},"prime-rib":{title:`Salt early. Crust later.`,cue:v,body:`Pat the roast dry and season it all over with the listed ${u}, then leave it uncovered on a rack in the refrigerator for 12–24 hours. Salt needs that time to work inward; a roast this thick is the one cut where skipping it is genuinely noticeable. The herb paste goes on much later — mix the pepper, rosemary, thyme, juniper, garlic, orange zest and oil into a rough paste shortly before it goes on the grill, and press it over the roast with only a light coat on the bone side. Rosemary and juniper left out overnight go dull and papery, which is why they are not part of the overnight step.`},"jerk-turkey":{title:`Mix the paste, keep it thin`,cue:v,body:`Stir the lime juice, oil, allspice, thyme, paprika, cinnamon and pepper together with the listed ${u} into a loose paste, and rub it over the tenderloin. Keep it thin: a wet coating steams rather than browns, and this cut gets only about half a minute a side of direct heat at the end to fix that. Toss the pineapple, red onion and scallion together separately with a pinch of salt — keep that bowl well away from the raw turkey and its paste. Chill the turkey while the grill comes up.`},burger:{title:`Mix cold. Shape loose. Salt late.`,cue:v,body:`Keep the meat cold and work it as little as you can get away with: fold the Worcestershire, pepper, SPG, garlic and squeezed onion through it just until combined, and stop. Overworking ground meat turns it springy and sausage-like. For bison add the listed oil, because it carries almost none of its own fat and will otherwise eat dry. Shape patties three-quarters to an inch thick with a shallow dimple pressed into the middle, which stops them doming as they cook. Two things about salt: the listed ${u} goes on **at the grill and not before**, since salting ground meat in advance dissolves its proteins and gives you the same springy texture; and most SPG blends are salt-first, so if yours is, cut that measured salt right back or leave it out.`},lobster:{title:`Split the shell, lift the meat`,cue:v,body:`Thaw the tails in the refrigerator. Cut down the top of each shell lengthwise with kitchen shears, stopping before the tail fan, then loosen the meat and lift it so it rides on top of the shell rather than sitting inside it. Leave it attached at the base. Pull out the dark vein if there is one, and pat everything dry. Season the exposed meat with part of the listed ${u} and a little of the smoked paprika, keeping the rest of both for the bath. The shell is doing a job here: it cradles the underside and keeps that side from overcooking while the top takes the gentle heat.`},achiote:{title:`Marinate, but not for long`,cue:v,body:`Whisk the achiote paste, lime juice and zest, oil, honey, cumin, oregano, garlic, black pepper and the listed ${u} into a loose marinade, then coat the thighs and refrigerate them while the grill heats. Twenty to thirty minutes, and no more. This is a lime-heavy mixture: left overnight the acid tightens the outside of the meat while the centre stays exactly as it was, so you end up with a firm surface and no more flavour than half an hour would have given you. Open out any thighs that are folded over on themselves, or the thick fold will still be behind when the rest is done.`},"bbq-chicken":{title:`Season, then split the sauce`,cue:v,body:`Mix the smoked paprika, garlic powder, onion powder, black pepper, cayenne and the listed ${u}, and season the thighs all over with it. Then stir the sauce together: ketchup, molasses, vinegar, brown sugar, Worcestershire, the second smaller measure of smoked paprika, and the hot sauce. Now divide that sauce in two before any of it goes near raw chicken. Half into a clean bowl for the table, half for brushing during the cook. Use a separate brush for each, and never carry the brushing half back to the table at the end.`},"beef-ribs":{title:`Mustard, pepper, and a little patience`,cue:v,body:`Thaw the ribs in the refrigerator. Pat them dry and trim hard surface fat and any silverskin you can reach, keeping the meat attached to each bone. Brush on a thin film of the measured mustard, mix the pepper, garlic powder, onion powder and smoked paprika with the listed ${u}, and season every meaty side. Cook now, or refrigerate them uncovered for 4\u201324 hours \u2014 if you season ahead, that is the whole salt allowance and none goes on again later. For enhanced or already-brined beef, skip the added salt.`},"mayo-chop":{title:`Salt the chops, keep the surface dry`,cue:v,body:`Pat the chops dry and season them all over with the listed ${u}, then leave them uncovered on a rack in the refrigerator for anything from 30 minutes to overnight. That is the whole salt allowance for the meat — the binder that goes on later carries none of its own. If half an hour is all you have, give them the last 20 minutes out of the refrigerator so they are not going onto the grill fridge-cold. For enhanced, injected, koshered or already-brined pork, skip this added salt.`},shrimp:{title:`Chimichurri, then a short marinade`,cue:v,body:`Stir the herbs, garlic, oil, vinegar, orange zest, paprika, pepper flakes and the listed ${u} together. Now split it: half goes on the raw shrimp, half is set aside for serving and must not touch them. Toss the shrimp in their half for no more than 15 minutes while the grill heats, and no longer — the vinegar and orange start firming the surface before any heat does, and shrimp left sitting in acid turn chalky. Peel and devein first if that has not been done.`}}[a]??{title:`Salt ahead. Mustard later.`,cue:v,body:`Use the listed ${u} once across the meat. Refrigerate on a rack ${a===`shoulder`?`12–24 hours`:r.protein===`Poultry`?`2–12 hours`:`2–4 hours`} if time allows. Just before grilling, pat any wet patches dry, add a thin mustard coat, and apply the salt-free rub. If cooking immediately, apply the same measured salt just before the mustard and rub. For injected, enhanced, koshered, or already salted meat, skip the added dry-brine salt.`}];if(a===`shoulder`)y.push({title:`Set up the unlit zone`,cue:`Grill ambient: 250–275°F`,body:`Use your chosen burner layout to leave enough unlit space for the whole shoulder. Stabilize the air temperature near the meat at grate level. Place a drip pan below it without obstructing airflow. Put dry wood chips in a smoker box positioned only where your grill manufacturer permits; never on a burner tube.`},{title:`Build the bark`,cue:`Light smoke early · watch the surface`,body:`Place the shoulder over unlit burners with the fat cap toward the strongest heat. Keep the lid closed and replenish the smoke box as needed for the first 3–4 hours. After that, spritz dry-looking patches only if needed, at most hourly. Expect a stall around 150–170°F; a steady grill and patience matter more than a clock.`},{title:`Wrap the set bark`,cue:`Usually 160–175°F internally`,body:`Once the bark is dark and firmly attached, wrap tightly in two layers of heavy foil with ${lp($(.25,`cup`,`apple juice`),s)} from the wrap ingredients. Return to 250–275°F indirect heat. Once wrapped, a 275°F oven can finish the job too.`},{title:`Probe for tenderness`,cue:`Usually 195–205°F`,body:`Start checking at 195°F in several thick spots away from bone. Keep cooking if the probe still meets resistance; even 203°F is not a guarantee. A 7–9 lb shoulder often takes 10–16 hours total. Build in extra time for the stall and rest; do not multiply that time by the ingredient scale.`},{title:`Rest, pull, and season`,cue:`Rest 1–2 hr · hot hold at 140°F or above`,body:`Vent the wrap for about 10 minutes, then rewrap and rest in an insulated cooler or low oven. Check the meat stays at least 140°F while hot holding. Pull the pork, discard large fat pockets, and fold in defatted juices. Mix the listed sauce ingredients, then add to the meat a little at a time. Refrigerate leftovers within 2 hours after hot holding ends, or 1 hour if the air is above 90°F.`});else if(a===`tri-tip`)y.push({title:`Mustard, then the coffee rub`,cue:`About 5 min · a thin coat is plenty`,body:`Mix the coffee, brown sugar, ancho, cumin, and paprika in a clean bowl. Pat any wet patches on the roast dry, brush on the measured mustard, and press the rub over every surface. No further salt goes on the meat if you already used it. Use enough rub to cover without building a paste, and throw away whatever touched raw beef. Keep the roast in the refrigerator while the grill comes up to heat.`},{title:`Stir the sauce, then chill it`,cue:`About 5 min · keep it cold until serving`,body:`Whisk the yogurt or sour cream with the measured adobo sauce, garlic, lime juice, cumin, sauce salt, and pepper. Taste it with a clean spoon and adjust. If your scaled amount asks for part of a garlic clove, mince a whole one and use what looks right. Keep this well away from the raw beef and refrigerated until the roast is sliced.`},{title:`Set a hot zone and an unlit one`,cue:`Grill ambient: 350–400°F · lid closed`,body:`Follow your grill’s lighting sequence, preheat, and clean the grates. You choose which burners stay lit, but leave an unlit area big enough for the whole roast. Read the air beside the food with a grate-level thermometer and settle it at 350–400°F; burner knob positions are not temperatures. Plan to keep the thin tip of the roast over the gentler side.`},{title:`Set the crust over direct heat`,cue:`About 8–10 min total · turn and watch it`,body:`Brown the roast over the lit burners, turning about halfway through and more often if the rub darkens fast. Keep the lid closed between checks. Coffee and ancho are already dark and brown sugar scorches, so this rub looks done long before the meat is — you are after a set, aromatic crust, not a black one. Move it to the unlit side straight away if flames flare or the surface gets ahead of the center.`},{title:`Finish over the unlit burners`,cue:`Ambient 350–400°F · internal at least 145°F`,body:`Move the roast fully off the lit burners and close the lid, holding 350–400°F near the meat. Start probing after about 15 minutes of indirect cooking, then every few minutes as it closes in. Go in from the side, into the thickest part, and check more than one spot. Take it off only once it reads at least 145°F; resting is not a way to make up the difference. A 2–2½ lb roast usually takes 35–60 minutes in total, longer if it is thick. Never multiply that by the ingredient scale.`},{title:`Rest, rotate, and slice both grains`,cue:`Rest 10–15 min · 3 minutes is the safety minimum`,body:`Rest the roast on a clean board for 10–15 minutes, tented loosely if you like. Now use the note you made at the start: a tri-tip’s fibres run two different ways, so cut the roast apart where the grain turns, rotate each piece, and slice each one thinly across its own fibres. Slicing the whole triangle one way leaves half of it chewy. Serve the cold sauce beside the beef, not over it. Refrigerate leftovers within 2 hours, or within 1 hour if it is above 90°F outside.`});else if(a===`foil-boat`)y.push({title:`Build the boat`,cue:`About 5 min · leave the top open`,body:`Double a sheet of heavy-duty foil, fold the sides up an inch or two and crimp the corners tight so melted butter cannot run out. Keep the bottom flat and the top open. A sealed packet steams the fish, which is a different cook and not this one. Grease the base with a little of the measured butter and lay the fillets in a single layer, skin down if they have it. Fold any very thin tail back under itself so it does not overcook before the rest.`},{title:`Butter and season`,cue:`Lemon juice waits for the plate`,body:`Scatter the lemon pepper evenly over the fish, then dot the rest of the butter across the fillets. That is the whole seasoning — no binder, no rub, nothing to press on. Hold the fresh lemon juice back until the fish is cooked and plated; adding it now just dilutes the butter and does nothing for the flavour.`},{title:`Set an unlit zone for the boat`,cue:`Grill ambient: 375–400°F · lid closed`,body:`Follow your grill’s lighting sequence, preheat and clean the grates. You choose which burners are lit, but keep at least one going and leave an unlit area big enough for the whole boat. Read the air beside the fish at grate level and settle it at 375–400°F — the lid gauge measures somewhere else entirely. Never lay foil across the whole grate or block the vents.`},{title:`Lid down, boat open`,cue:`First check at 6–12 min by thickness`,body:`Sit the boat over the unlit area and close the lid. Nothing gets flipped. Check at 6 minutes for a thin fillet, 8 for a medium one, 12 for anything near an inch. Rotate the boat if one end is running ahead. Spoon a little of the melted butter back over the top if you like. If the butter is browning hard or drying out, move the boat further from the lit burners and check the ambient temperature before you touch the fish.`},{title:`Probe every fillet, then serve`,cue:`Internal: 145°F in each one`,body:`Slide the probe in sideways through the thickest part of each fillet, keeping it clear of the foil, which will read hot. Every fillet needs 145°F before it comes off — easy flaking is a hint, not a measurement. Support the boat underneath with a wide spatula and slide the whole thing onto a rimmed tray; use gloves and mind the hot butter. Lift the fish onto plates, spoon the butter over, and add the lemon juice now. Fish needs no resting time at this target. Refrigerate leftovers within 2 hours, or within 1 hour if it is above 90°F out.`});else if(a===`burger`)y.push({title:`Two zones, and a hot one`,cue:`Grill ambient: 450–500°F`,body:`Follow your grill’s lighting sequence, get the direct zone properly hot and clean the grates, then oil them. Leave a cooler or unlit side free. Burgers drip fat onto burners and flare, and the cooler side is where you move them when that happens rather than standing there watching them blacken.`},{title:`Sear hard, and flip once`,cue:`About 3–5 minutes a side`,body:`Lay the patties over the direct zone and leave them alone for three to five minutes, then flip once. Do not press them — every drop that hisses onto the burners is juice that has left the burger, and it buys you nothing but a flare-up. If the crust is running ahead of the centre, move them to the cooler side and close the lid.`},{title:`Cheese, onions, buns`,cue:`Final 2 minutes`,body:`Lay the smoked cheddar on for the last minute or two and close the lid; trapped heat melts it far better than direct flame. Put the thick onion rounds on beside the burgers until they are marked and softened, and toast the buns cut-side down for the last minute. Watch them — buns go from toasted to charcoal in well under a minute at this heat.`},{title:`Probe every patty`,cue:`Internal 160°F · rest 3 min`,body:`Slide the probe in sideways through the centre of each patty, not down through the top. Every one needs 160°F. This is the one cut here that is not 145°F, because grinding takes whatever was on the surface of the meat and distributes it throughout, so the centre has to get hot enough to deal with it. A safe burger can still look pink inside — colour has never been a doneness test, and in ground meat it is a particularly bad one. Rest three minutes, then build with the charred onion, pickles and sauce.`});else if(a===`lobster`)y.push({title:`Start the butter bath`,cue:`Grill ambient: 325–350°F · 3–5 min`,body:`Follow your grill’s lighting sequence and settle it at 325–350°F measured at grate level beside the pan. Set a shallow pan over the **unlit** zone and add the butter, sparkling wine, garlic, lemon zest, tarragon, half the chives and the rest of the paprika and salt. Let it melt and come together gently. An unlit burner is still a cooking zone — the pan is heated by the air and the surfaces around it, which is exactly the point. Put it over a live flame and the butter splits and scorches from underneath.`},{title:`Bathe and baste, never flip`,cue:`Baste every 3–4 minutes`,body:`Nestle the tails shell-side down in the bath so the meat sits above the butter rather than under it, spoon butter over the exposed meat and close the lid. Baste every three or four minutes, and rotate the pan if one end of the grill runs hotter. The tails do not get turned at any point. Start probing at the first-check time for your tail size: six minutes for small, nine for medium, twelve for jumbo.`},{title:`Probe, then finish bright`,cue:`Internal 145°F · rest 1–2 min`,body:`Slide a thin probe sideways into the thickest part of the meat, keeping it clear of both the shell and the pan, which read hotter than the lobster does. Take each tail out at 145°F; the meat should look pearly and opaque by then, though that is the clue and the probe is the decision. Neither the wine nor the lemon makes undercooked shellfish safe. Rest one to two minutes. Finish with the reserved lemon juice and the chives you held back, and if you want butter on the table, warm a clean portion for it — the basting butter has been sitting with raw lobster in it all cook and does not come to the table.`});else if(a===`achiote`)y.push({title:`Grill hot and clean`,cue:`Grill ambient: 425–450°F`,body:`Follow your grill’s lighting sequence, get the direct zone to 425–450°F at grate level, then clean the grates and oil them lightly. Leave one cooler edge or unlit patch free — you will want it. Lift each thigh out of the marinade and let the excess run off before it goes on: a wet coating steams and then scorches instead of browning, and the marinade left in the dish is not a sauce.`},{title:`Turn once and watch the colour`,cue:`About 5–8 minutes on the first side`,body:`Lay the thighs down smooth side first and close the lid. Give them five to eight minutes, turn once, and leave them alone. Achiote is deep red before it meets any heat and there is honey in the marinade, so this will look further along than it is — that is exactly the trap. If it is darkening faster than the centre is cooking, move it to the cooler edge and keep the lid closed.`},{title:`Probe, rest, and build the tacos`,cue:`Internal 165°F · rest 5 min`,body:`Probe sideways into the thickest thigh and take it off only at 165°F. Colour and clear juices prove nothing here, least of all under a red marinade. Move it to a clean tray, rest five minutes, then slice across the grain. Serve it with warm tortillas, charred lime, cilantro, pickled onion and avocado, and use a clean board and knife rather than the ones the raw chicken touched.`});else if(a===`bbq-chicken`)y.push({title:`Grill it clean before any sauce`,cue:`Sear 3–4 minutes a side · 400–425°F`,body:`Follow your grill’s lighting sequence, hold 400–425°F at grate level and clean the grates. Sear the thighs over direct heat for three to four minutes a side to get colour on them, then move them over the unlit zone and close the lid. Keep going there until the thickest piece is around 150–155°F. No sauce yet — none of it goes on while the chicken still has this much cooking left.`},{title:`Paint, turn, paint again`,cue:`Final 4–6 minutes`,body:`Brush a thin layer of the brushing half over the chicken, close the lid for a minute or two, turn, and brush again. Repeat once or twice over the unlit zone. Thin coats are the whole technique: each one sets and dries before the next goes on, and that is what builds a lacquer. One thick coat does the opposite — the outside burns while the inside of the layer is still wet. If you want a little more tack and char at the very end, a short spell over direct heat will do it, but stand there and watch it, because this sauce is mostly sugar.`},{title:`Probe, rest, and use the clean half`,cue:`Internal 165°F · rest 5 min`,body:`Probe the thickest thigh sideways, under the glaze rather than through it, and remove only at 165°F. Sauce colour tells you nothing about the centre. Rest five minutes on a clean tray, then spoon or brush over the half of the sauce you set aside at the start — the half that never met the raw-chicken brush. Pickles, toasted buns or slaw, and refrigerate leftovers within 2 hours.`});else if(a===`prime-rib`)y.push({title:`Set the grill for a gentle roast`,cue:`Grill ambient: 250–275°F`,body:`Follow your grill’s lighting sequence and settle the air at grate level to 250–275°F, with the roast over the unlit burners. Sit it bone-side down on a rack over a rimmed pan. Put a leave-in probe into the centre of the thickest muscle, keeping clear of bone and any large fat seam — both read hotter or cooler than the meat and will lie to you all afternoon. Ambient heat is the supply; the centre probe is the decision.`},{title:`Cook indirect and ignore the clock`,cue:`First check at 60 min`,body:`Close the lid and leave it alone. Reckon on roughly 40 minutes a pound at this ambient, but treat that as a planning number only: shape and thickness matter far more than weight, and a long flat roast beats a short fat one to temperature every time. Take it off the indirect heat at about 135–140°F, which leaves room for the sear and for carryover.`},{title:`Sear it hard at the end`,cue:`45–75 seconds per broad side`,body:`Move the roast to a tray and turn your lit burners up until the grates are properly hot. Sear each broad face for 45–75 seconds, rotating to brown rather than blacken — rosemary and juniper burn fast and turn acrid. Then check the centre again. It must read at least 145°F before the roast is carved and served; if the sear and carryover have not carried it there, put it back over indirect heat until they do. Searing is for the crust, not for the safety endpoint.`},{title:`Rest, whisk, and carve`,cue:`Rest 20–30 min`,body:`Tent it loosely on a board and give it the full 20–30 minutes; a roast this size genuinely needs it, and the crust firms up while it waits. Meanwhile stir the sour cream, horseradish, Dijon, lemon juice, chives and a pinch of salt together, taste it, and hold back extra horseradish to pass at the table. Carve between the bones, or take the bones off in one piece first and then slice across the grain. Keep the raw-beef board and knife away from the finished sauce.`});else if(a===`jerk-turkey`)y.push({title:`Set up two zones`,cue:`Grill ambient: 400–425°F`,body:`Follow your grill’s lighting sequence and hold 400–425°F at grate level, lighting enough burners to get there while leaving an unlit area for the turkey. Clean the grates now, because the paste will stick to anything left on them. Keep the lid closed between checks.`},{title:`Indirect first, and turn once`,cue:`About 12–15 min a side`,body:`Put the tenderloin over the unlit zone and close the lid. Turn it once after 12–15 minutes. Turkey tenderloin is about as lean as poultry gets, so the indirect heat is doing the real work here — it brings the centre up without driving the surface past the point where the spices scorch. Start checking the centre at 20 minutes.`},{title:`Char the pineapple`,cue:`4–6 min over direct heat`,body:`While the turkey is over the unlit side, put the pineapple, onion and scallion in a basket or on a sheet of foil over the lit burners for 4–6 minutes, stirring once. Pineapple carries a lot of sugar and will flare given the chance, so keep it moving and keep an eye on it. Set it aside somewhere clean.`},{title:`Sear, probe, rest, slice`,cue:`Internal: 165°F · rest 5 min`,body:`Once the centre reads 155–160°F, move the tenderloin over direct heat for 30–45 seconds a side to brown the paste. Then probe the thickest part from the side and take it off only at 165°F — that is the poultry endpoint, not the 145°F used for whole cuts of beef and pork, and it is not negotiable for turkey. Rest 5 minutes, slice across the grain, and fold the charred pineapple through with a squeeze of lime.`});else if(a===`shrimp`)y.push({title:`Get the grill properly hot`,cue:`Grill ambient: 450–475°F`,body:`Follow your grill’s lighting sequence and get a direct zone to 450–475°F at grate level, keeping a cooler edge or unlit patch free to move things to. Clean the grates and oil them. Shrimp want real heat and a short cook: too low and they poach in their own liquid and go soft before anything browns. Thread them onto skewers or load a grill basket — loose shrimp find the gaps in the grate every time.`},{title:`Two minutes, turn, two to four more`,cue:`Char the orange halves alongside`,body:`Lay the shrimp out in a single layer over the direct zone and put the orange halves cut-side down beside them. Give the shrimp about 2 minutes, turn them once, then 2–4 minutes more depending on size. This is the whole cook. Shrimp proteins tighten fast, so the window between properly done and rubbery is measured in seconds rather than minutes — stay at the grill.`},{title:`Probe, dress, and serve`,cue:`Internal: 145°F`,body:`Slide the probe sideways into the thickest shrimp and take them off at 145°F. Opaque flesh is a clue; the thermometer is the decision. Toss them with the half of the chimichurri you set aside at the start — the half that never touched raw shrimp — and squeeze the charred orange over the top. Never reuse the marinade half as a sauce. Refrigerate leftovers within 2 hours, or within 1 hour if it is above 90°F out.`});else if(a===`beef-ribs`)y.push({title:`Build the peppery crust, uncovered`,cue:`Grill ambient: 275–300°F · 1½–3 hr`,body:`Follow your grill’s lighting sequence and your own burner plan, and settle the air beside the food at 275–300°F measured at grate level. Set the ribs bone-side down over the unlit burners with space between them and close the lid. Rotate them if one end of the grill colours faster. You are waiting for a deep brown crust that no longer wipes off under a finger, not for a number — the meat will read somewhere around 160–175°F when that happens. The sauce stays off entirely at this stage; its sugar would burn long before the meat is ready.`},{title:`Cover it, and wait for the probe to glide`,cue:`About 300°F · 2–4 hr covered`,body:`Arrange the ribs bone-side down in a snug metal pan in a single layer. Pour the measured stock and the pan vinegar around them, leaving the tops exposed, and aim for roughly a quarter inch of liquid underneath. The pan decides that depth, not the recipe, so top it up with hot water. Seal tightly with foil and put it back over the unlit burners. Start checking 90 minutes in, then every 20–30 minutes, opening the foil away from your face. Probe several thick spots clear of the bone, and keep cooking any rib that still resists.`},{title:`Make the sauce, then split it`,cue:`During the last 30–45 min under foil`,body:`Whisk everything for the sauce except the butter together in a saucepan: ketchup, brown sugar, molasses, Worcestershire, the sauce vinegar, water, garlic powder, smoked paprika, black pepper and the cayenne if you want it. Simmer gently for 8–12 minutes, stirring, until it coats a spoon but still pours — consistency decides this, not a multiplied timer, so use a wider pan for a big batch. Off the heat, whisk in the butter. Now divide it in two before any of it goes near the grill: half for brushing, half covered and kept clean for the table.`},{title:`Paint on the sticky layers`,cue:`275–300°F indirect · 15–25 min`,body:`Lift the ribs carefully onto a clean, lightly oiled rack over a shallow tray, or straight onto clean grates if they will hold together, and leave the braising liquid behind. Keep everything over the unlit burners. Brush a thin coat of the brushing half over the tops and sides, close the lid for five to eight minutes until it turns tacky, and repeat for about three coats. Stop sooner if the edges are darkening fast. This stage is only setting a glaze; the ribs are already tender and direct flame has nothing to add.`},{title:`Rest, smother, bring napkins`,cue:`Rest 15–20 min`,body:`Rest the ribs loosely tented for 15–20 minutes. Warm the clean half of the sauce gently and spoon it generously over each rib, passing the rest at the table. Use clean utensils, and never tip the brushing half back in with the serving half. Refrigerate leftovers in shallow containers within 2 hours, or within 1 hour if it is above 90°F outside, and reheat them to 165°F.`});else if(a===`mayo-chop`)y.push({title:`Mix the binder, spread it thin`,cue:`About 5 min · 1–2 tsp per side`,body:`Stir the mayonnaise, Worcestershire, grated garlic, rosemary, thyme, smoked paprika and black pepper together in a clean bowl. Pat any moisture off the chops again, then spread the mixture over every surface in a thin, even film. One to two teaspoons a side is plenty; anything thicker slides off into the burners instead of browning. No oil goes on the meat, because the binder is the fat. Throw away whatever touched raw pork.`},{title:`Set a hot zone and an unlit one`,cue:`Sear zone 450–500°F · finish zone 350–400°F`,body:`Follow your grill’s lighting sequence, preheat, and clean the grates. You choose which burners stay lit, but leave an unlit area big enough to hold every chop at once. Read the air at grate level rather than trusting the knob positions: about 450–500°F over the lit side for the sear, and 350–400°F beside the chops on the unlit side for the finish.`},{title:`Sear, and move it if it flares`,cue:`2–3 min per side`,body:`Lay the chops over the lit burners and leave them there for two to three minutes a side, turning once — or a quarter turn first if you want crosshatch marks. Mayonnaise is fat, and fat reaching a burner flares. If that happens, move the chop over to the unlit side and close the lid for a moment rather than trying to beat the flame down with it still over the fire. Do not press the meat.`},{title:`Finish over the unlit zone`,cue:`Start probing around 140°F`,body:`Move every chop fully over the unlit burners, close the lid, and hold the air near them at 350–400°F. Begin checking about five minutes after they cross for a pair of chops, six for four of them. Slide the probe into the thickest part from the side and keep it clear of the bone, which runs hotter than the meat around it. Take each chop off at 145°F, and check them separately — thickness decides this, not how many are on the grill.`},{title:`Rest, then brighten`,cue:`Rest at least 3 min`,body:`Rest the chops on a clean platter for at least three minutes. That rest is part of the pork safety target rather than only a texture choice. Scatter over the parsley, and add a squeeze of lemon at the table if you want it — the acid is a finishing note here, not something to cook with. Refrigerate leftovers within 2 hours, or within 1 hour if it is above 90°F outside, and reheat them to 165°F.`});else if(a===`steak`){let e=r.method===`Reverse sear`;y.push({title:e?`Warm the center gently`:`Set up two zones`,cue:e?`Indirect ambient: 225–250°F`:`Grill ambient: 400–450°F`,body:e?`Choose which burners stay lit and place the steaks over unlit burners. Keep the grill near 225–250°F and turn the steaks occasionally. Begin probing after 20 minutes. When the center is around 120–125°F, move the steaks to a clean plate while you heat the searing zone. This is an intermediate temperature, not the serving target.`:`Preheat and clean the grill. Leave a cool area using the burners you choose. Sear the steaks on the hot side for about 2–4 minutes per side, checking early if thinner than 1 inch.`},{title:e?`Finish with a hard sear`:`Finish gently`,cue:e?`Direct sear: about 450–550°F`:`Move to indirect heat as needed`,body:e?`Turn up your selected searing burners and let the grates heat. Pat the steaks dry if needed, then sear, turning every 30–60 seconds. Stop when the crust is brown and the center has reached at least 145°F. If the crust finishes first, move to indirect heat until the center reaches that target.`:`Once a crust develops, move the steaks over unlit burners. Check the center from the side and finish to at least 145°F before removing. Avoid probing fat or bone.`},{title:`Add the garlic butter`,cue:`Rest at least 3 min`,body:`Combine the listed softened butter, grated garlic, parsley, and lemon juice. Add it after searing so the garlic does not scorch. Rest at least 3 minutes, then slice across the grain.`})}else a===`chop`||a===`tenderloin`?y.push({title:`Prep your cut and zones`,cue:`Grill ambient: 400–450°F`,body:a===`tenderloin`?`Remove silverskin and tuck the thin tail under for a more even shape. Preheat and clean the grates. Use your chosen burners to create direct heat and an unlit finishing area.`:`Trim hanging fat and preheat the grill. Clean the grates and reserve an unlit finishing area with your chosen burner layout.`},{title:`Brown, then finish`,cue:r.time,body:a===`tenderloin`?`Brown each side over direct heat, turning every few minutes, then move to indirect heat. Start checking around 15 minutes. Finish when the thickest part reaches 145°F; check each tenderloin separately.`:`Brown over direct heat for roughly 3–4 minutes per side, then move to the unlit zone as needed. Start checking at 10 minutes. Cook the thickest part to 145°F, keeping the probe clear of the bone.`},{title:`Rest and slice`,cue:`At least 3 min · 5 min is useful`,body:`Remove only after reaching 145°F. Rest at least 3 minutes, then finish with the listed butter and lemon juice. Slice tenderloin into medallions; serve chops whole or cut off the bone.`}):a===`thigh`||a===`breast`||a===`drumstick`?y.push({title:`Prep for even cooking`,cue:`Grill ambient: 375–425°F`,body:a===`breast`?`Pound the thick ends of boneless breasts to an even ¾–1 inch. Preheat and clean the grill; leave an unlit area using your chosen burners.`:`Trim loose skin and fat. Preheat and clean the grill. Leave enough room over unlit burners for the chicken without crowding it. Do not rinse raw chicken.`},{title:a===`breast`?`Brown, then move off the flame`:`Roast on the cool side`,cue:r.time,body:a===`breast`?`Brown over direct heat for about 3–5 minutes per side. Transfer to the unlit zone whenever the outside is sufficiently browned. Begin checking the thickest part at about 12 minutes; stop only after every breast reaches 165°F.`:`Cook over unlit burners, ${a===`thigh`?`skin-side up`:`rotating the drumsticks occasionally`}, with the lid closed. Begin probing after 25 minutes. Each piece must pass 165°F; continue toward 175–185°F for tender dark meat.`},{title:a===`breast`?`Glaze lightly`:`Crisp the skin`,cue:a===`breast`?`Internal finish: 165°F`:`Internal finish: 175–185°F`,body:a===`breast`?`If using barbecue sauce, brush it on during the last few minutes over indirect heat. Check every piece rather than assuming they finish together.`:`Once nearly done, briefly brown the skin over moderate direct heat, turning and watching closely for flare-ups. Move back to the cool zone as needed. Sweet sauce goes on only during the last few minutes.`},{title:`Rest on a clean platter`,cue:`Rest 5 min`,body:`Use clean utensils to transfer the cooked chicken. Rest 5 minutes and serve. This timing assumes individual pieces, not a whole bird.`}):y.push({title:`Support the fish`,cue:`Grill ambient: ${r.grill.join(`–`)}°F`,body:r.id===`cod-fillet`?`Preheat a clean grill and lightly oil a fish basket. Cod breaks easily, so keep it supported throughout cooking. Leave an unlit area available.`:`Preheat and clean the grates, then lightly oil the cooking surface or a fish basket. Leave an unlit area available so you can move the fish if it browns too quickly.`},{title:`Cook with a light touch`,cue:r.time,body:r.id===`lemon-salmon`?`Cook skin-side down with the lid closed; flipping is usually unnecessary. Begin checking the thickest part at 8 minutes. Move to the unlit zone if the skin is getting too dark.`:`Cook the ${r.id===`cod-fillet`?`basket over moderate direct heat, turning the basket carefully once`:`fillets over medium direct heat, turning once only when they release easily`}. Start checking at about 8 minutes. Finish over the unlit zone if the exterior is browning too quickly.`},{title:`Probe and brighten`,cue:`Internal finish: 145°F`,body:`Probe the center of the thickest part from the side. Reach 145°F before removal. Lift with a wide spatula, rest briefly, and finish with the measured lemon juice and dill.`+(r.id===`lemon-salmon`?` A little white albumin on salmon is edible protein, not a doneness test.`:``)});let b=a===`beef-ribs`?`Sear-iously smothered beef ribs`:a===`mayo-chop`?`Garlic-herb mayonnaise pork chops`:a===`burger`?`Steakhouse burgers, beef or bison`:a===`lobster`?`Champagne–garlic butter-bath `+o:a===`achiote`?`Achiote-lime grilled chicken thighs`:a===`bbq-chicken`?`Sauce-heavy BBQ chicken thighs`:a===`prime-rib`?`Rosemary & juniper prime rib`:a===`jerk-turkey`?`Jerk-spiced `+o:a===`shrimp`?`Chimichurri-orange `+o:a===`foil-boat`?`Butter & lemon-pepper `+o:a===`tri-tip`?`Coffee–ancho tri-tip with chipotle-lime sauce`:a===`shoulder`?i.title:a===`steak`?`Pepper & garlic `+o:a===`chop`||a===`tenderloin`?`Smoky Dijon `+o:r.protein===`Poultry`?`Smoky mustard `+o:`Dijon & lemon `+o,x=a===`beef-ribs`?1:a===`mayo-chop`?.625:a===`burger`?.375:a===`lobster`||a===`achiote`||a===`bbq-chicken`?.5:a===`prime-rib`?1:a===`jerk-turkey`?.4:a===`shrimp`||a===`foil-boat`?.5:a===`tri-tip`?.45:a===`shoulder`?.6:r.protein===`Poultry`&&a!==`breast`?.75:r.protein===`Seafood`?.375:.5,S=`./images/`+r.id+`.webp`,C=r.name;return{...i,id:r.id,protein:r.protein,title:b,description:r.description,headline:r.headline,cut:r,weightLb:t,sizeLabel:c,scale:s,timingNote:r.timing,photo:S,photoAlt:C+` with a browned exterior on a dark serving board`,photoCaption:C,ingredients:h,steps:y,grill:r.grill,internal:r.internal,method:r.method,time:r.time,rest:r.rest,finish:_,safety:g,serves:String(Math.max(1,Math.round(t/x))),wood:a===`beef-ribs`?`Pepper & paprika carry it · no wood needed`:a===`burger`?`No smoke needed · this one is all sear`:a===`lobster`?`None · the bath is the flavour`:a===`achiote`?`The paste carries it · no wood needed`:a===`bbq-chicken`?`Hickory, optional`:a===`jerk-turkey`?`Pimento wood if you can get it · otherwise none`:a===`prime-rib`?`Rosemary & juniper carry it · no wood needed`:a===`tri-tip`?`Coffee & ancho carry it · no wood needed`:a===`shoulder`?`Apple + hickory`:r.protein===`Poultry`?`Apple, optional`:`No smoke needed`,tip:a===`beef-ribs`?`Keep half the sauce clean and away from the brush, leave the sugar off until the meat is already tender, and let the probe rather than the clock decide when that is.`:a===`mayo-chop`?`Spread the binder thin, sear over the lit side, then finish over the unlit one and probe every chop clear of the bone. A flare-up is the binder doing its job, not a fault.`:a===`burger`?`Mix it cold, handle it as little as you can, and salt at the grill rather than ahead. Do not press the patties, and probe every one: 160°F here, not 145°F.`:a===`lobster`?`Keep the pan over an unlit burner, never flip the tails, and warm a clean portion of butter for the table rather than serving the one you basted with.`:a===`achiote`?`Twenty to thirty minutes in the marinade and no longer. Achiote and honey both darken well before the centre is done, so keep a cooler edge free.`:a===`bbq-chicken`?`Grill it clean first and sauce it last, in thin coats. Keep the serving half of the sauce away from the brush that touched raw chicken.`:a===`prime-rib`?`Salt it the night before, keep the probe out of bone and fat seams, and give it the full rest. The sear builds the crust; the probe decides doneness.`:a===`jerk-turkey`?`Keep the paste thin so it browns rather than steams, cook it indirect, and use the 165°F poultry endpoint. Pineapple carries sugar and will flare.`:a===`shrimp`?`Split the chimichurri before any of it touches raw shrimp. Fifteen minutes is the marinade limit, and four to six minutes is the entire cook.`:a===`foil-boat`?`Check the lemon-pepper label before you salt, keep the boat open rather than sealed, and probe every fillet. Thickness sets the time here, not weight.`:a===`tri-tip`?`Find the grain before the rub hides it, keep the thin end away from the hottest burner, and serve the sauce cold and beside the meat.`:a===`shoulder`?i.tip:`Ingredient amounts scale with total raw weight. Cooking time depends on individual thickness, airflow, and the actual heat near the food.`,attribution:r.attribution}}var hp={title:`What dry-brining actually does`,body:`Salt dissolves in moisture on the surface, then its ions diffuse into the meat. It changes muscle proteins in ways that help them retain more water during cooking. Given time in the refrigerator, you get seasoning below the surface and a drier exterior that browns more readily.`,takeaway:`Measure the salt once. Refrigerate while it works. A mustard binder and salt-free rub go on later.`},gp={title:`An OFF burner is still a cooking zone`,body:`Radiant heat from a lit burner browns the surface intensely. Away from that flame, hot air and surrounding surfaces heat the food more gently. An unlit section lets you control the outside and center separately; its actual temperature still needs a thermometer.`,takeaway:`Choose the burners that fit your grill. Measure beside the food instead of treating knob position as a temperature.`};function _p(e){if(e.family===`burger`)return{title:`Why ground meat is 160°F when a steak is 145°F`,body:`On a whole steak, essentially everything that matters lives on the outside, and searing the outside deals with it — which is why a rare centre is a defensible choice there. Grinding takes that surface and mixes it all the way through, so the middle of a patty now contains what used to be the outside of the meat. There is no longer an inside that was never exposed.`,takeaway:`The higher number is not caution about a different animal, it is the same caution applied to meat that no longer has a protected centre. Probe every patty, and ignore the colour.`};if(e.family===`beef-ribs`)return{title:`Safe and tender are two different numbers`,body:`Whole-cut beef is safe at 145°F with a short rest, and a short rib hits that in the first hour or so. It is still inedible. What makes a rib worth eating is collagen turning to gelatin, and that is a slow conversion that only really gets going well above the safety figure and keeps going for hours. Covering the pan is what makes the wait bearable for the meat: it cuts the evaporation that would otherwise dry the outside while the inside is still converting.`,takeaway:`Stop reading the thermometer as a doneness test here. Around 200–205°F is where the probe usually glides, but the resistance is the actual signal.`};if(e.family===`mayo-chop`)return{title:`Why a mayonnaise coat browns better than oil does`,body:`Mayonnaise is an emulsion: oil suspended in a little water and held there by egg yolk. Spread thin on meat it does three jobs at once. The water phase makes it cling, so the herbs and garlic stay where loose seasoning would fall off. The oil spreads heat evenly across an uneven surface. And the egg proteins brown alongside the meat’s own, which starts the crust at a lower surface temperature than plain oil manages. What is left by serving time is crust, not sauce — there is far too little of it to taste of mayonnaise.`,takeaway:`A thin film is the entire technique. Laid on thick, the outside of the coating burns while the inside stays wet and slides off the chop.`};if(e.family===`lobster`)return{title:`A bath, not a boil`,body:`Butter held gently around the meat does two things at once: it keeps the exposed surface from drying in moving air, and it carries the garlic, herbs and wine onto it. Let that butter get too hot and both stop working — it splits, the milk solids catch, and the outside of the tail races ahead of the centre. Lobster gives you a narrow window between translucent and rubbery, so anything that widens it is worth doing.`,takeaway:`Keep the pan over an unlit burner where the air heats it rather than the flame, and baste rather than submerge.`};if(e.family===`achiote`)return{title:`An acid marinade only reaches the surface`,body:`Lime juice does not travel far into meat. It works on the outermost layer, where it unwinds proteins and firms them up, and that layer is the only part it ever really changes. So a longer soak does not push more flavour inward; it just keeps working on the same thin shell until the texture turns tight and slightly chalky. Salt migrates inward given hours. Acid essentially does not.`,takeaway:`Twenty to thirty minutes buys you everything this marinade has to give. Overnight only costs you texture.`};if(e.family===`bbq-chicken`)return{title:`Thin coats set; one thick coat burns`,body:`A barbecue sauce this sweet is mostly sugar and water. Brushed on thin, the water flashes off and leaves the sugars to caramelise into a dry, glossy layer that the next coat can grip. Brushed on thick, the outside of the layer hits burning temperature while the inside is still wet, so you get a scorched skin over a sticky, uncooked middle that slides off the meat.`,takeaway:`Four or five thin coats over indirect heat, each given a minute to set. Save direct heat for a few seconds at the very end, if at all.`};if(e.family===`prime-rib`)return{title:`Why reverse-sear a roast this size`,body:`Heat travels into meat from the outside in, so a hot grill drives a steep gradient: the outer inch is well past done by the time the centre arrives. Cooking low keeps that gradient shallow, which is the whole reason a reverse-seared roast shows a thin grey band instead of a thick one. The trade is that almost no crust forms at 250°F, because browning needs a far hotter surface than that.`,takeaway:`Do the gentle cook first for an evenly coloured interior, then build the crust in the last two minutes over high heat.`};if(e.family===`jerk-turkey`)return{title:`Lean meat has no buffer`,body:`Fat and connective tissue buy you time: they melt, they hold water, and they forgive a few extra minutes. Turkey tenderloin has very little of either, so the gap between 165°F and dry is narrow and it closes fast over direct heat. The paste has a second problem of its own — its sugars, and the sugar in the pineapple beside it, brown and then burn long before the centre is ready.`,takeaway:`Cook it over the unlit side so the surface cannot run ahead of the centre, and save direct heat for the last thirty seconds a side.`};if(e.family===`shrimp`)return{title:`Two clocks are running at once`,body:`Shrimp proteins tighten at a low temperature and do it quickly, which is why the difference between springy and rubbery is under a minute at this heat. The marinade is a slower version of the same process: vinegar and citrus firm the surface with no heat involved at all, which is exactly how ceviche works. Fifteen minutes is seasoning. An hour gives you shrimp that were already half cooked before they reached the grate.`,takeaway:`Keep the marinade short and the cook shorter. Probe the thickest shrimp rather than reading the colour.`};if(e.family===`foil-boat`)return{title:`An open boat is not a sealed packet`,body:`The foil is doing the job of a small pan. It holds a fragile fillet together and keeps the butter and the cooking juices against the fish rather than letting them drip into the burners. Leaving the top open lets steam escape as it forms. Crimp it shut and the fish cooks in its own trapped moisture instead, which is much closer to steaming than to grilling and gives a softer, wetter surface.`,takeaway:`Fold the sides up, leave the top open, and let the closed grill lid be the thing that surrounds it with heat.`};if(e.family===`tri-tip`)return{title:`This crust will lie to you about doneness`,body:`Ground coffee and ancho are close to black before they meet any heat, and the brown sugar beside them starts caramelising long before the middle of a roast is warm. So this rub reaches the colour you are looking for earlier than almost anything else here, while the center is still cool. On most cuts a dark exterior is at least weak evidence of progress. On this one it is none.`,takeaway:`Judge the crust by smell and by whether it has set, not by how dark it looks. Then move it to the unlit side and let the probe say when it is done.`};if(e.family===`shoulder`)return{title:`The stall is evaporative cooling`,body:`As surface water evaporates, it carries heat away. For a while, that cooling can offset the heat entering a pork shoulder, and the probe barely moves. Collagen breakdown is happening too, but it is not the main cause of the stall.`,takeaway:`Foil reduces evaporation and speeds the cook, but softens bark. Wrap after the bark is set.`};if(e.id===`lemon-salmon`)return{title:`That white stuff on salmon?`,body:`The pale material that can appear on cooked salmon is albumin, a protein. It is edible. Its appearance varies and does not reliably tell you whether the center has reached a safe temperature.`,takeaway:`Use a probe in the thickest part; finish this recipe at 145°F.`};if(e.protein===`Seafood`)return{title:`Brown the outside, check the center`,body:`Maillard reactions create browned flavor at the hot surface. The center can still be behind, especially in a thick fillet. A browned exterior is not evidence that the fish has reached its internal target.`,takeaway:`Move to the unlit zone if the surface is ready first. Probe the center and finish at 145°F.`};if(e.protein===`Poultry`){let t=e.family!==`breast`;return{title:`Skin needs a different finish`,body:`Chicken skin browns and renders better with more heat than a long, low smoking session usually provides. A brief finish over direct heat can crisp it after the interior is almost ready. Sweet sauces can scorch during that finish.`+(t?` If you want the skin genuinely crisp rather than merely browned, a little baking powder worked into the dry-brine salt is the one trick that reliably does it. Powder, not soda — bicarbonate of soda on its own is a raw alkali and leaves a soapy, faintly metallic taste. Baking powder buffers that same bicarbonate with acid salts, and on skin it does two things at once: it lifts the surface pH, so the browning reactions run faster and begin at a lower temperature, and the carbon dioxide it gives off blisters the skin into a finely pitted surface with far more area to crisp.`:``),takeaway:t?`Brown the skin late and watch closely, and check each piece with a thermometer. For the crispest result, mix about ½ tsp of aluminum-free baking powder per pound of chicken into the measured salt and leave the pieces uncovered in the refrigerator ove
